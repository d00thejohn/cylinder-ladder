<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원기둥 사다리게임</title>

<style>
  :root {
    color-scheme: light;
    --blue: #2563eb;
    --text: #172033;
    --border: #dbe3ef;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f3f6fb;
    color: var(--text);
    font-family:
      system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px 36px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(23px, 5vw, 30px);
  }

  h2 {
    margin: 0 0 16px;
    font-size: 19px;
  }

  h3 {
    font-size: 16px;
  }

  p {
    line-height: 1.65;
  }

  .muted {
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
  }

  .card {
    margin-top: 18px;
    padding: 22px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 5px 20px #17203306;
  }

  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    min-height: 46px;
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
  }

  button:hover:not(:disabled) {
    background: #eff6ff;
  }

  button.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  input[type="number"],
  input[type="text"] {
    width: 100%;
    min-height: 46px;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: white;
    font-size: 16px;
  }

  #count {
    width: 85px;
  }

  #nameFields {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(145px, 1fr));
    gap: 12px;
    margin: 18px 0;
  }

  #nameFields label {
    display: grid;
    gap: 6px;
    font-size: 14px;
  }

  #players {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }

  .player {
    min-height: 50px;
    border-left: 6px solid var(--player-color);
    overflow-wrap: anywhere;
  }

  .player.done {
    background: #f0fdf4;
    opacity: 1;
  }

  .player.active {
    background: #fff7ed;
    outline: 2px solid #fb923c;
    opacity: 1;
  }

  .canvas-scroll {
    width: 100%;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(#f8fbff, #fff);
  }

  canvas {
    display: block;
  }

  .hint {
    margin: 8px 0 0;
    font-size: 13px;
    color: #64748b;
  }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }

  #rotation {
    width: min(240px, 65vw);
    min-height: 32px;
  }

  #status {
    min-height: 54px;
    margin: 16px 0 8px;
    padding: 14px;
    border-radius: 12px;
    background: #eff6ff;
    color: #1e40af;
    font-size: 17px;
    font-weight: 650;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  progress {
    width: 100%;
    height: 14px;
    accent-color: var(--blue);
  }

  #reveal {
    margin-left: auto;
  }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    padding: 13px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }

  th {
    background: #f1f5f9;
  }

  .badge {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 8px;
    border-radius: 50%;
  }

  .number-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    min-height: 36px;
    padding: 4px 10px;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 20px;
    font-weight: 750;
  }

  [hidden] {
    display: none !important;
  }

  @media (max-width: 600px) {
    main {
      margin: 18px auto;
      padding: 0 10px 24px;
    }

    .card {
      padding: 16px 12px;
      border-radius: 14px;
    }

    #nameFields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    #players {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .results-grid {
      grid-template-columns: 1fr;
      gap: 18px;
    }

    #generate,
    #reveal {
      width: 100%;
    }

    #reveal {
      margin-left: 0;
    }

    #status {
      font-size: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }
</style>
</head>

<body>
<main>
  <h1>원기둥 사다리게임</h1>

  <p class="muted">
    이름을 누르면 사다리를 타고 내려갑니다.
    밑면 숫자는 무작위로 배정되며, 게임 중에는 바뀌지 않습니다.
  </p>

  <section class="card">
    <h2>1. 참가자 설정</h2>

    <div class="row">
      <label for="count">인원수</label>
      <input
        id="count"
        type="number"
        min="2"
        max="24"
        value="6"
        inputmode="numeric"
      >
      <button id="applyCount" type="button">
        입력칸 변경
      </button>
    </div>

    <div id="nameFields"></div>

    <div class="row">
      <button id="generate" class="primary" type="button">
        사다리 생성 / 새 게임
      </button>
      <span class="muted">
        2~24명 · 이름을 비우면 번호 사용
      </span>
    </div>
  </section>

  <section id="gamePanel" class="card" hidden>
    <h2>2. 이름을 눌러 출발</h2>

    <div id="players"></div>

    <div id="canvasScroll" class="canvas-scroll">
      <canvas
        id="canvas"
        role="img"
        aria-label="원기둥 사다리와 무작위 도착 숫자"
      ></canvas>
    </div>

    <p id="scrollHint" class="hint" hidden>
      사다리 화면을 좌우로 밀면 전체 경로와 숫자를 볼 수 있습니다.
    </p>

    <p class="hint">
      밑면의 큰 숫자 배지는 안내선으로 도착점과 연결되어 있습니다.
    </p>

    <div class="controls">
      <label for="rotation">원기둥 회전</label>
      <input
        id="rotation"
        type="range"
        min="-180"
        max="180"
        value="-25"
      >
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <progress id="progress" value="0" max="6"></progress>

    <div class="controls">
      <span id="completedText">0 / 6명 완료</span>
      <button
        id="reveal"
        class="primary"
        type="button"
        disabled
      >
        최종 결과 보기
      </button>
    </div>
  </section>

  <section id="resultPanel" class="card" hidden>
    <h2>3. 최종 결과</h2>

    <div class="results-grid">
      <div>
        <h3>참가자별 대응</h3>
        <table>
          <thead>
            <tr>
              <th scope="col">참가자</th>
              <th scope="col">도착 숫자</th>
            </tr>
          </thead>
          <tbody id="resultByName"></tbody>
        </table>
      </div>

      <div>
        <h3>숫자순</h3>
        <table>
          <thead>
            <tr>
              <th scope="col">숫자</th>
              <th scope="col">참가자</th>
            </tr>
          </thead>
          <tbody id="resultByNumber"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const TAU = Math.PI * 2;
const DURATION = 4000;

let game = null;
let animationFrame = null;
let viewWidth = 600;
let viewHeight = 600;

function colorFor(index, count) {
  return `hsl(${Math.round(index * 360 / count)}, 72%, 39%)`;
}

function randomInt(max) {
  const range = 0x100000000;
  const limit = range - (range % max);
  const buffer = new Uint32Array(1);

  do {
    crypto.getRandomValues(buffer);
  } while (buffer[0] >= limit);

  return buffer[0] % max;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getCount() {
  const n = Number($("count").value);

  if (!Number.isInteger(n) || n < 2 || n > 24) {
    alert("인원수는 2~24 사이의 정수로 입력해 주세요.");
    return null;
  }

  return n;
}

function makeNameFields() {
  const n = getCount();
  if (n === null) return;

  const previous = [...$("nameFields").querySelectorAll("input")]
    .map(input => input.value);

  $("nameFields").replaceChildren();

  for (let i = 0; i < n; i++) {
    const label = document.createElement("label");
    label.textContent = `${i + 1}번 참가자`;

    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 20;
    input.placeholder = `${i + 1}번`;
    input.value = previous[i] || "";
    input.autocomplete = "off";
    input.setAttribute("aria-label", `${i + 1}번 참가자 이름`);

    label.append(input);
    $("nameFields").append(label);
  }
}

function point(theta, z) {
  return { theta, z };
}

function tracePath(startLane, bridges, n) {
  const step = TAU / n;

  let lane = startLane;
  let angle = lane * step;

  const points = [point(angle, 0)];

  for (const bridge of bridges) {
    points.push(point(angle, bridge.z));

    const nextLane = (bridge.lane + 1) % n;
    let direction = 0;

    if (lane === bridge.lane) {
      direction = 1;
    } else if (lane === nextLane) {
      direction = -1;
    }

    if (direction !== 0) {
      const from = angle;
      const to = angle + direction * step;

      for (let j = 1; j <= 24; j++) {
        points.push(
          point(from + (to - from) * j / 24, bridge.z)
        );
      }

      angle = to;
      lane = direction === 1 ? nextLane : bridge.lane;
    }
  }

  points.push(point(angle, 1));

  const cumulative = [0];

  for (let i = 1; i < points.length; i++) {
    const da = points[i].theta - points[i - 1].theta;
    const dz = (points[i].z - points[i - 1].z) * 3;

    cumulative.push(
      cumulative[i - 1] + Math.hypot(da, dz)
    );
  }

  return {
    points,
    cumulative,
    length: cumulative[cumulative.length - 1],
    destination: lane
  };
}

function outputFor(index) {
  const lane = game.paths[index].destination;
  return game.outputs[lane];
}

function generateGame() {
  const n = getCount();
  if (n === null) return;

  const fields = [...$("nameFields").querySelectorAll("input")];

  if (fields.length !== n) {
    makeNameFields();
    alert("입력칸을 변경했습니다. 이름 확인 후 다시 생성하세요.");
    return;
  }

  if (game && !confirm("현재 게임을 지우고 새 게임을 만들까요?")) {
    return;
  }

  cancelAnimationFrame(animationFrame);

  const names = fields.map(
    (input, i) => input.value.trim() || `${i + 1}번`
  );

  const bridgeCount = Math.max(24, n * 8);
  const bridges = [];

  for (let k = 0; k < bridgeCount; k++) {
    bridges.push({
      z: 0.045 + (k + 1) * 0.91 / (bridgeCount + 1),
      lane: randomInt(n)
    });
  }

  if (!bridges.some(bridge => bridge.lane === n - 1)) {
    bridges[randomInt(bridgeCount)].lane = n - 1;
  }

  // 각 밑면 경로에 1~n을 무작위로 배정한다.
  const outputs = shuffle(
    Array.from({ length: n }, (_, i) => i + 1)
  );

  game = {
    n,
    names,
    bridges,
    outputs,
    paths: names.map((_, i) => tracePath(i, bridges, n)),
    done: new Set(),
    busy: false,
    active: null,
    fraction: 0,
    revealed: false
  };

  $("players").replaceChildren();

  names.forEach((name, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "player";
    button.style.setProperty(
      "--player-color", colorFor(index, n)
    );

    button.addEventListener(
      "click", () => startPlayer(index)
    );

    $("players").append(button);
  });

  $("gamePanel").hidden = false;
  $("resultPanel").hidden = true;

  $("resultByName").replaceChildren();
  $("resultByNumber").replaceChildren();

  $("status").textContent =
    "이름을 눌러 출발하세요. 밑면 숫자는 무작위로 배정되었습니다.";

  $("progress").max = n;
  $("canvasScroll").scrollLeft = 0;

  updateControls();
  resizeCanvas();
}

function updateControls() {
  if (!game) return;

  [...$("players").children].forEach((button, i) => {
    const done = game.done.has(i);
    const active = game.busy && game.active === i;

    button.textContent =
      game.names[i] +
      (active ? " · 이동 중" : done ? " · 완료" : "");

    button.disabled = game.busy || done;
    button.classList.toggle("done", done);
    button.classList.toggle("active", active);
  });

  $("progress").value = game.done.size;

  $("completedText").textContent =
    `${game.done.size} / ${game.n}명 완료`;

  const ready = game.done.size === game.n && !game.busy;

  $("reveal").disabled = !ready || game.revealed;

  $("reveal").textContent = game.revealed
    ? "결과 공개 완료"
    : ready
      ? "최종 결과 보기"
      : "전원 도착 후 결과 공개";
}

function startPlayer(index) {
  if (!game || game.busy || game.done.has(index)) return;

  const currentGame = game;

  game.busy = true;
  game.active = index;
  game.fraction = 0;

  $("status").textContent =
    `${game.names[index]} — 출발!`;

  updateControls();
  draw();

  let startedAt = null;

  function tick(timestamp) {
    if (game !== currentGame) return;

    if (startedAt === null) {
      startedAt = timestamp;
    }

    game.fraction = Math.min(
      (timestamp - startedAt) / DURATION, 1
    );

    if (game.fraction >= 1) {
      game.busy = false;
      game.done.add(index);

      const number = outputFor(index);

      $("status").textContent =
        `${game.names[index]} → ${number}번 도착!` +
        (game.done.size === game.n
          ? " 전원 완료! 최종 결과 버튼을 눌러 주세요."
          : "");

      updateControls();
      draw();
      return;
    }

    draw();
    animationFrame = requestAnimationFrame(tick);
  }

  animationFrame = requestAnimationFrame(tick);
}

function getGeometry() {
  const radius = Math.min(
    viewWidth * 0.36,
    Math.max(125, game.n * 19)
  );

  return {
    cx: viewWidth / 2,
    radius,
    ellipse: Math.min(58, radius * 0.23),
    top: 105,
    bottom: viewHeight - 175
  };
}

function project(p) {
  const g = getGeometry();
  const rotation = Number($("rotation").value) * Math.PI / 180;
  const angle = p.theta + rotation;
  const depth = Math.sin(angle);

  return {
    x: g.cx + Math.cos(angle) * g.radius,
    y: g.top + p.z * (g.bottom - g.top) + depth * g.ellipse,
    depth
  };
}

function visiblePath(path, fraction) {
  if (fraction >= 1) return path.points;

  const target = path.length * fraction;
  const result = [path.points[0]];

  for (let i = 1; i < path.points.length; i++) {
    if (path.cumulative[i] <= target) {
      result.push(path.points[i]);
      continue;
    }

    const before = path.cumulative[i - 1];
    const distance = path.cumulative[i] - before;
    const ratio = distance > 0
      ? (target - before) / distance
      : 0;

    const a = path.points[i - 1];
    const b = path.points[i];

    result.push(point(
      a.theta + (b.theta - a.theta) * ratio,
      a.z + (b.z - a.z) * ratio
    ));

    break;
  }

  return result;
}

function roundedBox(x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + width, y, x + width, y + height, radius);
  ctx.arcTo(x + width, y + height, x, y + height, radius);
  ctx.arcTo(x, y + height, x, y, radius);
  ctx.arcTo(x, y, x + width, y, radius);
  ctx.closePath();
}

function shortName(name) {
  const characters = Array.from(name);
  return characters.length > 7
    ? characters.slice(0, 6).join("") + "…"
    : name;
}

function drawOutputLabels() {
  const endpoints = [];

  for (let lane = 0; lane < game.n; lane++) {
    const p = project(point(lane * TAU / game.n, 1));
    endpoints.push({ lane, ...p });
  }

  // 画面上の左右位置で並べ、ラベルの重なりを防ぐ
  endpoints.sort((a, b) =>
    a.x - b.x || a.depth - b.depth
  );

  const padding = 10;
  const slotWidth = (viewWidth - padding * 2) / game.n;
  const badgeWidth = Math.min(48, slotWidth - 6);
  const badgeHeight = 42;
  const badgeY = viewHeight - 55;
  const guideY = viewHeight - 82;

  const completedOwners = new Map();

  for (const index of game.done) {
    completedOwners.set(
      game.paths[index].destination, index
    );
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  endpoints.forEach((endpoint, position) => {
    const lane = endpoint.lane;
    const centerX =
      padding + slotWidth * (position + 0.5);

    const owner = completedOwners.get(lane);
    const completed = owner !== undefined;

    const selected =
      !game.busy &&
      game.active !== null &&
      game.paths[game.active].destination === lane;

    const color = completed
      ? colorFor(owner, game.n)
      : "#475569";

    // 도착점과 숫자 배지 사이의 안내선
    ctx.beginPath();
    ctx.moveTo(endpoint.x, endpoint.y);
    ctx.lineTo(endpoint.x, guideY - 15);
    ctx.lineTo(centerX, guideY);
    ctx.lineTo(centerX, badgeY - badgeHeight / 2);

    ctx.strokeStyle = color;
    ctx.lineWidth = selected ? 3 : completed ? 2 : 1;
    ctx.globalAlpha = completed ? 0.9 : 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 실제 도착점
    ctx.beginPath();
    ctx.arc(endpoint.x, endpoint.y, selected ? 6 : 4, 0, TAU);
    ctx.fillStyle = completed ? color : "#475569";
    ctx.fill();

    // 큰 숫자 배지
    roundedBox(
      centerX - badgeWidth / 2,
      badgeY - badgeHeight / 2,
      badgeWidth,
      badgeHeight,
      10
    );

    ctx.fillStyle = completed ? color : "#ffffff";
    ctx.fill();

    ctx.strokeStyle = completed ? color : "#64748b";
    ctx.lineWidth = selected ? 4 : 2;
    ctx.stroke();

    ctx.fillStyle = completed ? "#ffffff" : "#0f172a";
    ctx.font = "800 23px system-ui, sans-serif";

    ctx.fillText(
      String(game.outputs[lane]),
      centerX,
      badgeY + 1
    );
  });
}

function draw() {
  ctx.clearRect(0, 0, viewWidth, viewHeight);
  if (!game) return;

  const segments = [];

  function addSegment(a, b, highlighted = false) {
    const pa = project(a);
    const pb = project(b);

    segments.push({
      a: pa,
      b: pb,
      depth: (pa.depth + pb.depth) / 2,
      highlighted
    });
  }

  // 원기둥 위아래 테두리
  for (const z of [0, 1]) {
    for (let j = 0; j < 120; j++) {
      addSegment(
        point(j * TAU / 120, z),
        point((j + 1) * TAU / 120, z)
      );
    }
  }

  // 세로 경로
  for (let lane = 0; lane < game.n; lane++) {
    const angle = lane * TAU / game.n;
    addSegment(point(angle, 0), point(angle, 1));
  }

  // 이웃 경로 사이 연결선
  for (const bridge of game.bridges) {
    const start = bridge.lane * TAU / game.n;
    const step = TAU / game.n;

    for (let j = 0; j < 20; j++) {
      addSegment(
        point(start + step * j / 20, bridge.z),
        point(start + step * (j + 1) / 20, bridge.z)
      );
    }
  }

  let visible = null;

  if (game.active !== null) {
    visible = visiblePath(
      game.paths[game.active],
      game.fraction
    );

    for (let i = 1; i < visible.length; i++) {
      addSegment(visible[i - 1], visible[i], true);
    }
  }

  segments.sort((a, b) =>
    a.depth - b.depth ||
    Number(a.highlighted) - Number(b.highlighted)
  );

  for (const segment of segments) {
    ctx.beginPath();
    ctx.moveTo(segment.a.x, segment.a.y);
    ctx.lineTo(segment.b.x, segment.b.y);

    if (segment.highlighted) {
      ctx.strokeStyle = colorFor(game.active, game.n);
      ctx.lineWidth = 4.5;
      ctx.globalAlpha = segment.depth < 0 ? 0.72 : 1;
    } else {
      ctx.strokeStyle = segment.depth < 0
        ? "#a9b5c6"
        : "#64748b";
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = segment.depth < 0 ? 0.38 : 0.78;
    }

    ctx.stroke();
  }

  ctx.globalAlpha = 1;

  // 출발 위치와 이름
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let lane = 0; lane < game.n; lane++) {
    const p = project(point(lane * TAU / game.n, 0));

    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, TAU);
    ctx.fillStyle = colorFor(lane, game.n);
    ctx.fill();

    ctx.font = "650 12px system-ui, sans-serif";
    ctx.fillText(
      shortName(game.names[lane]),
      p.x,
      p.y - 20
    );
  }

  drawOutputLabels();

  // 현재 이동 위치
  if (visible && visible.length) {
    const head = project(visible[visible.length - 1]);

    ctx.beginPath();
    ctx.arc(head.x, head.y, 7, 0, TAU);
    ctx.fillStyle = colorFor(game.active, game.n);
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
  }

  ctx.fillStyle = "#64748b";
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(
    "출발: 위쪽 이름 / 도착: 아래쪽 숫자 배지",
    12,
    22
  );
}

function resizeCanvas() {
  if (!game) return;

  const containerWidth = $("canvasScroll").clientWidth;
  const mobile = window.innerWidth <= 600;

  // 인원이 많으면 캔버스 폭을 넓혀 숫자 겹침 방지
  viewWidth = Math.max(
    containerWidth,
    game.n * 54,
    340
  );

  viewHeight = mobile ? 550 : 650;

  canvas.style.width = `${viewWidth}px`;
  canvas.style.height = `${viewHeight}px`;

  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(viewWidth * dpr);
  canvas.height = Math.round(viewHeight * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  $("scrollHint").hidden =
    viewWidth <= containerWidth + 1;

  draw();
}

function appendResultRow(target, index, number, numberFirst) {
  const row = document.createElement("tr");
  const nameCell = document.createElement("td");
  const numberCell = document.createElement("td");

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.style.background = colorFor(index, game.n);

  nameCell.append(
    badge,
    document.createTextNode(game.names[index])
  );

  const numberBadge = document.createElement("span");
  numberBadge.className = "number-pill";
  numberBadge.textContent = String(number);
  numberCell.append(numberBadge);

  if (numberFirst) {
    row.append(numberCell, nameCell);
  } else {
    row.append(nameCell, numberCell);
  }

  target.append(row);
}

function revealResults() {
  if (
    !game ||
    game.busy ||
    game.done.size !== game.n ||
    game.revealed
  ) {
    return;
  }

  $("resultByName").replaceChildren();
  $("resultByNumber").replaceChildren();

  const results = game.names.map((_, index) => ({
    index,
    number: outputFor(index)
  }));

  for (const { index, number } of results) {
    appendResultRow(
      $("resultByName"),
      index,
      number,
      false
    );
  }

  [...results]
    .sort((a, b) => a.number - b.number)
    .forEach(({ index, number }) => {
      appendResultRow(
        $("resultByNumber"),
        index,
        number,
        true
      );
    });

  game.revealed = true;
  updateControls();

  $("resultPanel").hidden = false;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  $("resultPanel").scrollIntoView({
    behavior: reducedMotion ? "auto" : "smooth",
    block: "start"
  });
}

$("applyCount").addEventListener(
  "click", makeNameFields
);

$("generate").addEventListener(
  "click", generateGame
);

$("reveal").addEventListener(
  "click", revealResults
);

$("rotation").addEventListener(
  "input", draw
);

window.addEventListener(
  "resize", resizeCanvas
);

makeNameFields();
</script>
</body>
</html>
