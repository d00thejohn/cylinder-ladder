<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원기둥 사다리게임</title>

<style>
  :root {
    color-scheme: light;
    --blue: #2563eb;
    --text: #172033;
    --border: #dbe3ef;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f3f6fb;
    color: var(--text);
    font-family:
      system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  main {
    max-width: 1050px;
    margin: 24px auto;
    padding: 0 14px 36px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(23px, 5vw, 30px);
  }

  h2 {
    margin: 0 0 16px;
    font-size: 19px;
  }

  h3 {
    font-size: 16px;
  }

  .muted {
    color: #64748b;
    font-size: 14px;
    line-height: 1.65;
  }

  .card {
    margin-top: 18px;
    padding: 22px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
  }

  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    min-height: 46px;
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
  }

  button:hover:not(:disabled) {
    background: #eff6ff;
  }

  button.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  input[type="number"],
  input[type="text"] {
    width: 100%;
    min-height: 46px;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: white;
    font-size: 16px;
  }

  #count {
    width: 85px;
  }

  #nameFields {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(145px, 1fr));
    gap: 12px;
    margin: 18px 0;
  }

  #nameFields label {
    display: grid;
    gap: 6px;
    font-size: 14px;
  }

  #players {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .player {
    min-height: 52px;
    border-left: 6px solid var(--player-color);
    overflow-wrap: anywhere;
  }

  .player.done {
    background: #f0fdf4;
  }

  .player.active {
    background: #fff7ed;
    outline: 2px solid #fb923c;
    opacity: 1;
  }

  .canvas-wrap {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(#f8fbff, white);
  }

  canvas {
    display: block;
    width: 100%;
    height: 630px;
  }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin: 14px 0;
  }

  .check-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }

  input[type="checkbox"] {
    width: 19px;
    height: 19px;
    accent-color: var(--blue);
  }

  #rotation {
    width: min(210px, 55vw);
  }

  #resultCard {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin: 16px 0;
    padding: 18px;
    border: 2px solid #bfdbfe;
    border-radius: 14px;
    background: #eff6ff;
  }

  #status {
    line-height: 1.6;
    overflow-wrap: anywhere;
    font-weight: 600;
  }

  #bigNumber {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    min-width: 78px;
    height: 78px;
    padding: 0 12px;
    border: 1px solid #bfdbfe;
    border-radius: 16px;
    background: white;
    color: #1d4ed8;
    font-size: 40px;
    font-weight: 800;
  }

  progress {
    width: 100%;
    height: 14px;
    accent-color: var(--blue);
  }

  #reveal {
    margin-left: auto;
  }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }

  th {
    background: #f1f5f9;
  }

  .color-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 8px;
    border-radius: 50%;
  }

  .number-pill {
    display: inline-block;
    min-width: 42px;
    padding: 5px 10px;
    border-radius: 9px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 21px;
    font-weight: 750;
    text-align: center;
  }

  [hidden] {
    display: none !important;
  }

  @media (max-width: 600px) {
    main {
      margin-top: 16px;
      padding: 0 9px 24px;
    }

    .card {
      padding: 16px 11px;
    }

    #nameFields,
    #players {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    canvas {
      height: 550px;
    }

    #generate,
    #reveal {
      width: 100%;
    }

    #reveal {
      margin-left: 0;
    }

    .results-grid {
      grid-template-columns: 1fr;
    }

    #resultCard {
      padding: 13px;
    }

    #bigNumber {
      min-width: 65px;
      height: 68px;
      font-size: 34px;
    }
  }
</style>
</head>

<body>
<main>
  <h1>원기둥 사다리게임</h1>

  <p class="muted">
    이름을 누르면 사다리를 따라 약 4.8초 동안 내려갑니다.
    밑면 숫자는 무작위로 배정되며 게임 중에는 바뀌지 않습니다.
  </p>

  <section class="card">
    <h2>1. 참가자 설정</h2>

    <div class="row">
      <label for="count">인원수</label>

      <input
        id="count"
        type="number"
        min="2"
        max="24"
        value="6"
        inputmode="numeric"
      >

      <button id="applyCount" type="button">
        입력칸 변경
      </button>
    </div>

    <div id="nameFields"></div>

    <div class="row">
      <button id="generate" class="primary" type="button">
        사다리 생성 / 새 게임
      </button>

      <span class="muted">
        2~24명 · 이름을 비우면 번호 사용
      </span>
    </div>
  </section>

  <section id="gamePanel" class="card" hidden>
    <h2>2. 이름을 눌러 출발</h2>

    <div id="players"></div>

    <div class="canvas-wrap">
      <canvas
        id="canvas"
        role="img"
        aria-label="회전하는 원기둥 사다리와 도착 숫자"
      ></canvas>
    </div>

    <div class="controls">
      <label class="check-label">
        <input id="autoRotate" type="checkbox" checked>
        이동 중 자동 회전
      </label>

      <label for="rotation">수동 회전</label>

      <input
        id="rotation"
        type="range"
        min="-180"
        max="180"
        value="-25"
      >
    </div>

    <p class="muted">
      자동 회전이 불편하면 체크를 해제하세요.
      완료한 이름을 다시 누르면 같은 경로를 재생합니다.
      아래 숫자 배지는 안내선으로 실제 도착점과 연결되어 있습니다.
    </p>

    <div id="resultCard" role="status" aria-live="polite">
      <div id="status">참가자 이름을 눌러 주세요.</div>
      <div id="bigNumber" aria-label="도착 숫자">?</div>
    </div>

    <progress id="progress" value="0" max="6"></progress>

    <div class="controls">
      <span id="completedText">0 / 6명 완료</span>

      <button
        id="reveal"
        class="primary"
        type="button"
        disabled
      >
        전원 도착 후 결과 공개
      </button>
    </div>
  </section>

  <section id="resultPanel" class="card" hidden>
    <h2>3. 전체 결과표</h2>

    <div class="results-grid">
      <div>
        <h3>참가자별 대응</h3>

        <table>
          <thead>
            <tr>
              <th scope="col">참가자</th>
              <th scope="col">도착 숫자</th>
            </tr>
          </thead>
          <tbody id="resultByName"></tbody>
        </table>
      </div>

      <div>
        <h3>숫자순</h3>

        <table>
          <thead>
            <tr>
              <th scope="col">숫자</th>
              <th scope="col">참가자</th>
            </tr>
          </thead>
          <tbody id="resultByNumber"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const TAU = Math.PI * 2;

// 이동 시간: 4.8초
const DURATION = 4800;

// 값이 클수록 회전이 목표 각도를 더 완만하게 따라간다.
const ROTATION_SMOOTHING_MS = 120;

let game = null;
let frameId = null;

let viewWidth = 600;
let viewHeight = 630;

let rotation = -25 * Math.PI / 180;

function colorFor(index, count) {
  return `hsl(${Math.round(index * 360 / count)}, 72%, 39%)`;
}

function randomInt(max) {
  const range = 0x100000000;
  const limit = range - range % max;
  const buffer = new Uint32Array(1);

  do {
    crypto.getRandomValues(buffer);
  } while (buffer[0] >= limit);

  return buffer[0] % max;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}

function normalizeAngle(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

function syncRotationSlider() {
  $("rotation").value = String(
    normalizeAngle(rotation) * 180 / Math.PI
  );
}

function getCount() {
  const count = Number($("count").value);

  if (!Number.isInteger(count) || count < 2 || count > 24) {
    alert("인원수는 2~24 사이의 정수로 입력해 주세요.");
    return null;
  }

  return count;
}

function makeNameFields() {
  const count = getCount();

  if (count === null) return;

  const previous = [
    ...$("nameFields").querySelectorAll("input")
  ].map(input => input.value);

  $("nameFields").replaceChildren();

  for (let i = 0; i < count; i++) {
    const label = document.createElement("label");
    label.textContent = `${i + 1}번 참가자`;

    const input = document.createElement("input");

    input.type = "text";
    input.maxLength = 20;
    input.placeholder = `${i + 1}번`;
    input.value = previous[i] || "";
    input.autocomplete = "off";

    input.setAttribute(
      "aria-label",
      `${i + 1}번 참가자 이름`
    );

    label.append(input);
    $("nameFields").append(label);
  }
}

function point(theta, z) {
  return { theta, z };
}

function tracePath(startLane, bridges, count) {
  const step = TAU / count;

  let lane = startLane;
  let angle = lane * step;

  const points = [point(angle, 0)];

  for (const bridge of bridges) {
    points.push(point(angle, bridge.z));

    const nextLane = (bridge.lane + 1) % count;

    let direction = 0;

    if (lane === bridge.lane) {
      direction = 1;
    } else if (lane === nextLane) {
      direction = -1;
    }

    if (direction !== 0) {
      const from = angle;
      const to = angle + direction * step;

      for (let j = 1; j <= 24; j++) {
        points.push(
          point(
            from + (to - from) * j / 24,
            bridge.z
          )
        );
      }

      angle = to;
      lane = direction === 1 ? nextLane : bridge.lane;
    }
  }

  points.push(point(angle, 1));

  const cumulative = [0];

  for (let i = 1; i < points.length; i++) {
    const da = points[i].theta - points[i - 1].theta;
    const dz = (points[i].z - points[i - 1].z) * 3;

    cumulative.push(
      cumulative[i - 1] + Math.hypot(da, dz)
    );
  }

  return {
    points,
    cumulative,
    length: cumulative[cumulative.length - 1],
    destination: lane
  };
}

function outputFor(index) {
  const destination = game.paths[index].destination;
  return game.outputs[destination];
}

function visiblePath(path, fraction) {
  if (fraction >= 1) {
    return path.points;
  }

  const target = path.length * Math.max(0, fraction);
  const result = [path.points[0]];

  for (let i = 1; i < path.points.length; i++) {
    if (path.cumulative[i] <= target) {
      result.push(path.points[i]);
      continue;
    }

    const before = path.cumulative[i - 1];
    const distance = path.cumulative[i] - before;

    const ratio = distance > 0
      ? (target - before) / distance
      : 0;

    const a = path.points[i - 1];
    const b = path.points[i];

    result.push(
      point(
        a.theta + (b.theta - a.theta) * ratio,
        a.z + (b.z - a.z) * ratio
      )
    );

    break;
  }

  return result;
}

function updateControls() {
  if (!game) return;

  [...$("players").children].forEach((button, index) => {
    const done = game.done.has(index);
    const active = game.busy && game.active === index;

    button.textContent =
      game.names[index] +
      (
        active
          ? " · 이동 중"
          : done
            ? " · 다시 보기"
            : ""
      );

    button.disabled = game.busy;
    button.classList.toggle("done", done);
    button.classList.toggle("active", active);
  });

  $("progress").value = game.done.size;

  $("completedText").textContent =
    `${game.done.size} / ${game.n}명 완료`;

  const ready =
    game.done.size === game.n && !game.busy;

  $("reveal").disabled =
    !ready || game.revealed;

  $("reveal").textContent = game.revealed
    ? "결과 공개 완료"
    : ready
      ? "전체 결과표 보기"
      : "전원 도착 후 결과 공개";

  $("rotation").disabled = game.busy;
  $("autoRotate").disabled = game.busy;

  // 이동 도중 실수로 설정을 바꾸지 못하도록 잠근다.
  $("count").disabled = game.busy;
  $("applyCount").disabled = game.busy;
  $("generate").disabled = game.busy;

  $("nameFields").querySelectorAll("input").forEach(input => {
    input.disabled = game.busy;
  });
}

function generateGame() {
  const count = getCount();

  if (count === null) return;

  const fields = [
    ...$("nameFields").querySelectorAll("input")
  ];

  if (fields.length !== count) {
    makeNameFields();

    alert(
      "입력칸을 변경했습니다. 이름 확인 후 다시 생성하세요."
    );

    return;
  }

  if (
    game &&
    !confirm("현재 게임을 지우고 새 게임을 만들까요?")
  ) {
    return;
  }

  cancelAnimationFrame(frameId);

  const names = fields.map(
    (input, index) =>
      input.value.trim() || `${index + 1}번`
  );

  // 기존 max(24, count * 8)보다 연결선 25% 감소
  const bridgeCount = Math.max(18, count * 6);

  const bridges = [];

  for (let k = 0; k < bridgeCount; k++) {
    bridges.push({
      z: 0.045 + (k + 1) * 0.91 / (bridgeCount + 1),
      lane: randomInt(count)
    });
  }

  // 마지막 경로와 첫 경로 사이 연결선 포함
  if (!bridges.some(bridge => bridge.lane === count - 1)) {
    bridges[randomInt(bridgeCount)].lane = count - 1;
  }

  game = {
    n: count,
    names,
    bridges,

    outputs: shuffle(
      Array.from(
        { length: count },
        (_, index) => index + 1
      )
    ),

    paths: names.map(
      (_, index) => tracePath(index, bridges, count)
    ),

    done: new Set(),
    active: null,
    busy: false,
    fraction: 0,
    revealed: false,
    startedAt: 0,
    lastFrameAt: 0,
    rotateDuringRun: true
  };

  $("players").replaceChildren();

  names.forEach((name, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "player";

    button.style.setProperty(
      "--player-color",
      colorFor(index, count)
    );

    button.addEventListener(
      "click",
      () => startPlayer(index)
    );

    $("players").append(button);
  });

  $("gamePanel").hidden = false;
  $("resultPanel").hidden = true;

  $("resultByName").replaceChildren();
  $("resultByNumber").replaceChildren();

  $("status").textContent =
    "참가자 이름을 눌러 주세요.";

  $("bigNumber").textContent = "?";
  $("bigNumber").style.color = "#1d4ed8";
  $("resultCard").style.borderColor = "#bfdbfe";

  $("progress").max = count;

  updateControls();
  resizeCanvas();
}

function startPlayer(index) {
  if (!game || game.busy) return;

  cancelAnimationFrame(frameId);

  game.active = index;
  game.busy = true;
  game.fraction = 0;

  game.rotateDuringRun =
    $("autoRotate").checked;

  // 출발점을 앞쪽 중앙에 배치한다.
  if (game.rotateDuringRun) {
    rotation =
      Math.PI / 2 -
      game.paths[index].points[0].theta;

    syncRotationSlider();
  }

  const color = colorFor(index, game.n);

  $("status").textContent =
    `${game.names[index]} — 출발!`;

  $("bigNumber").textContent = "…";
  $("bigNumber").style.color = color;
  $("resultCard").style.borderColor = color;

  game.startedAt = performance.now();
  game.lastFrameAt = game.startedAt;

  updateControls();
  draw();

  frameId = requestAnimationFrame(animate);
}

function animate() {
  if (!game || !game.busy) return;

  const now = performance.now();
  const elapsed = now - game.startedAt;
  const delta = Math.max(0, now - game.lastFrameAt);

  game.lastFrameAt = now;

  game.fraction = Math.min(
    elapsed / DURATION,
    1
  );

  const path = visiblePath(
    game.paths[game.active],
    game.fraction
  );

  const head = path[path.length - 1];

  if (game.rotateDuringRun) {
    const desired =
      Math.PI / 2 - head.theta;

    const difference =
      normalizeAngle(desired - rotation);

    const smoothing =
      1 - Math.exp(-delta / ROTATION_SMOOTHING_MS);

    rotation += difference * smoothing;

    syncRotationSlider();
  }

  if (game.fraction >= 1) {
    // 도착 직전의 아주 작은 회전 오차는 그대로 두어
    // 끝나는 순간 갑자기 회전하지 않도록 한다.
    finishPlayer();
    return;
  }

  draw();

  frameId = requestAnimationFrame(animate);
}

function finishPlayer() {
  const index = game.active;
  const wasDone = game.done.has(index);

  game.busy = false;
  game.fraction = 1;
  game.done.add(index);

  const number = outputFor(index);

  $("bigNumber").textContent = String(number);

  $("status").textContent =
    `${game.names[index]} → ${number}번 도착!` +
    (
      !wasDone && game.done.size === game.n
        ? " 전원 완료! 전체 결과표를 확인하세요."
        : ""
    );

  updateControls();
  draw();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && game && game.busy) {
    cancelAnimationFrame(frameId);
    frameId = requestAnimationFrame(animate);
  }
});

function geometry() {
  const rows = Math.ceil(game.n / 8);

  return {
    cx: viewWidth / 2,
    radius: Math.min(viewWidth * 0.36, 265),
    ellipse: Math.min(viewWidth * 0.085, 54),
    top: 88,
    bottom: viewHeight - (rows * 43 + 110),
    labelTop: viewHeight - rows * 43 - 8,
    rows
  };
}

function project(p) {
  const g = geometry();

  const angle = p.theta + rotation;
  const depth = Math.sin(angle);

  return {
    x: g.cx + Math.cos(angle) * g.radius,

    y:
      g.top +
      p.z * (g.bottom - g.top) +
      depth * g.ellipse,

    depth
  };
}

function roundedBox(x, y, width, height, radius) {
  ctx.beginPath();

  ctx.moveTo(x + radius, y);

  ctx.arcTo(
    x + width, y,
    x + width, y + height,
    radius
  );

  ctx.arcTo(
    x + width, y + height,
    x, y + height,
    radius
  );

  ctx.arcTo(
    x, y + height,
    x, y,
    radius
  );

  ctx.arcTo(
    x, y,
    x + width, y,
    radius
  );

  ctx.closePath();
}

function shortName(name) {
  const chars = Array.from(name);

  return chars.length > 5
    ? chars.slice(0, 4).join("") + "…"
    : name;
}

function drawOutputLabels() {
  const g = geometry();
  const endpoints = [];

  for (let lane = 0; lane < game.n; lane++) {
    endpoints.push({
      lane,
      ...project(
        point(lane * TAU / game.n, 1)
      )
    });
  }

  endpoints.sort(
    (a, b) => a.x - b.x || a.depth - b.depth
  );

  const owners = new Map();

  for (const index of game.done) {
    owners.set(
      game.paths[index].destination,
      index
    );
  }

  const selectedLane =
    game.active !== null && !game.busy
      ? game.paths[game.active].destination
      : null;

  const columns = Math.ceil(game.n / g.rows);
  const slotWidth = (viewWidth - 20) / columns;
  const badgeWidth = Math.min(45, slotWidth - 5);

  const labels = endpoints.map((endpoint, index) => {
    const row = Math.floor(index / columns);
    const column = index % columns;

    const x =
      10 + (column + 0.5) * slotWidth;

    const y =
      g.labelTop + row * 43 + 17;

    const owner = owners.get(endpoint.lane);
    const completed = owner !== undefined;

    return {
      endpoint,
      x,
      y,
      completed,
      selected: endpoint.lane === selectedLane,

      color: completed
        ? colorFor(owner, game.n)
        : "#64748b"
    };
  });

  const ordered = [...labels].sort(
    (a, b) => Number(a.selected) - Number(b.selected)
  );

  // 안내선을 먼저 그린다.
  for (const label of ordered) {
    const {
      endpoint, x, y, selected, color
    } = label;

    ctx.beginPath();

    ctx.moveTo(endpoint.x, endpoint.y);
    ctx.lineTo(x, y - 17);

    ctx.strokeStyle = color;
    ctx.lineWidth = selected ? 3 : 1;
    ctx.globalAlpha = selected ? 1 : 0.16;

    ctx.stroke();

    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(
      endpoint.x,
      endpoint.y,
      selected ? 6 : 3,
      0,
      TAU
    );

    ctx.fillStyle = color;
    ctx.fill();
  }

  // 숫자 배지는 안내선 위에 그린다.
  for (const label of labels) {
    const {
      endpoint, x, y,
      completed, selected, color
    } = label;

    roundedBox(
      x - badgeWidth / 2,
      y - 17,
      badgeWidth,
      34,
      8
    );

    ctx.fillStyle =
      completed ? color : "#ffffff";

    ctx.fill();

    ctx.strokeStyle =
      selected ? "#111827" : color;

    ctx.lineWidth =
      selected ? 3 : 1.5;

    ctx.stroke();

    ctx.fillStyle =
      completed ? "#ffffff" : "#0f172a";

    ctx.font = "800 20px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      String(game.outputs[endpoint.lane]),
      x,
      y + 1
    );
  }
}

function draw() {
  ctx.clearRect(
    0, 0,
    viewWidth, viewHeight
  );

  if (!game) return;

  const segments = [];

  function addSegment(a, b, highlighted = false) {
    const pa = project(a);
    const pb = project(b);

    segments.push({
      a: pa,
      b: pb,
      depth: (pa.depth + pb.depth) / 2,
      highlighted
    });
  }

  // 원기둥의 위아래 경계
  for (const z of [0, 1]) {
    for (let j = 0; j < 120; j++) {
      addSegment(
        point(j * TAU / 120, z),
        point((j + 1) * TAU / 120, z)
      );
    }
  }

  // 세로 경로
  for (let lane = 0; lane < game.n; lane++) {
    const angle = lane * TAU / game.n;

    addSegment(
      point(angle, 0),
      point(angle, 1)
    );
  }

  // 가로 연결선
  for (const bridge of game.bridges) {
    const start =
      bridge.lane * TAU / game.n;

    const step = TAU / game.n;

    for (let j = 0; j < 18; j++) {
      addSegment(
        point(
          start + step * j / 18,
          bridge.z
        ),

        point(
          start + step * (j + 1) / 18,
          bridge.z
        )
      );
    }
  }

  let visible = null;

  if (game.active !== null) {
    visible = visiblePath(
      game.paths[game.active],
      game.fraction
    );

    for (let i = 1; i < visible.length; i++) {
      addSegment(
        visible[i - 1],
        visible[i],
        true
      );
    }
  }

  segments.sort(
    (a, b) =>
      a.depth - b.depth ||
      Number(a.highlighted) -
      Number(b.highlighted)
  );

  for (const segment of segments) {
    ctx.beginPath();

    ctx.moveTo(segment.a.x, segment.a.y);
    ctx.lineTo(segment.b.x, segment.b.y);

    if (segment.highlighted) {
      ctx.strokeStyle =
        colorFor(game.active, game.n);

      ctx.lineWidth = 4;

      ctx.globalAlpha =
        segment.depth < 0 ? 0.65 : 1;
    } else {
      ctx.strokeStyle =
        segment.depth < 0
          ? "#aab7c9"
          : "#64748b";

      ctx.lineWidth = 1.1;

      // 뒤쪽 선을 연하게 해 시각적 복잡도를 줄인다.
      ctx.globalAlpha =
        segment.depth < 0 ? 0.20 : 0.70;
    }

    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 출발 위치 표시
  for (let lane = 0; lane < game.n; lane++) {
    const p = project(
      point(lane * TAU / game.n, 0)
    );

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.5, 0, TAU);

    ctx.fillStyle =
      colorFor(lane, game.n);

    ctx.fill();

    const showName =
      game.n <= 8 || lane === game.active;

    ctx.font =
      "650 12px system-ui, sans-serif";

    ctx.fillStyle =
      colorFor(lane, game.n);

    ctx.globalAlpha =
      p.depth < 0 ? 0.5 : 1;

    ctx.fillText(
      showName
        ? shortName(game.names[lane])
        : `${lane + 1}번`,

      p.x,
      p.y - 18
    );
  }

  ctx.globalAlpha = 1;

  drawOutputLabels();

  // 이동 중인 점
  if (visible && visible.length) {
    const head = project(
      visible[visible.length - 1]
    );

    ctx.beginPath();
    ctx.arc(head.x, head.y, 7, 0, TAU);

    ctx.fillStyle =
      colorFor(game.active, game.n);

    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
  }

  ctx.fillStyle = "#64748b";
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = "left";

  ctx.fillText(
    "위: 출발 / 아래: 무작위 도착 숫자",
    12,
    22
  );
}

function resizeCanvas() {
  if (!game) return;

  viewWidth = canvas.clientWidth;
  viewHeight = canvas.clientHeight;

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(viewWidth * dpr);

  canvas.height =
    Math.round(viewHeight * dpr);

  ctx.setTransform(
    dpr, 0,
    0, dpr,
    0, 0
  );

  draw();
}

function appendResultRow(
  target,
  index,
  number,
  numberFirst
) {
  const row =
    document.createElement("tr");

  const nameCell =
    document.createElement("td");

  const numberCell =
    document.createElement("td");

  const dot =
    document.createElement("span");

  dot.className = "color-dot";

  dot.style.background =
    colorFor(index, game.n);

  nameCell.append(
    dot,
    document.createTextNode(game.names[index])
  );

  const pill =
    document.createElement("span");

  pill.className = "number-pill";
  pill.textContent = String(number);

  numberCell.append(pill);

  if (numberFirst) {
    row.append(numberCell, nameCell);
  } else {
    row.append(nameCell, numberCell);
  }

  target.append(row);
}

function revealResults() {
  if (
    !game ||
    game.busy ||
    game.done.size !== game.n ||
    game.revealed
  ) {
    return;
  }

  $("resultByName").replaceChildren();
  $("resultByNumber").replaceChildren();

  const results = game.names.map(
    (_, index) => ({
      index,
      number: outputFor(index)
    })
  );

  results.forEach(({ index, number }) => {
    appendResultRow(
      $("resultByName"),
      index,
      number,
      false
    );
  });

  [...results]
    .sort((a, b) => a.number - b.number)
    .forEach(({ index, number }) => {
      appendResultRow(
        $("resultByNumber"),
        index,
        number,
        true
      );
    });

  game.revealed = true;

  updateControls();

  $("resultPanel").hidden = false;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  $("resultPanel").scrollIntoView({
    behavior:
      reducedMotion ? "auto" : "smooth",

    block: "start"
  });
}

$("applyCount").addEventListener(
  "click",
  makeNameFields
);

$("generate").addEventListener(
  "click",
  generateGame
);

$("reveal").addEventListener(
  "click",
  revealResults
);

$("rotation").addEventListener("input", () => {
  if (game && game.busy) return;

  rotation =
    Number($("rotation").value) *
    Math.PI / 180;

  draw();
});

window.addEventListener(
  "resize",
  resizeCanvas
);
